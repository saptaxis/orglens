name: orglens-plan07

# Plan 07 rewrites the workflow engine and exercises it on real article
# content. It must never reach the source documents, so traitful-docs is
# deliberately absent from this config — the container gets the code repo and
# a disposable copy of the packets, and nothing else.

repos:
  orglens:
    path: ~/Dropbox/code/orglens
    workdir: true
  sandbox:
    path: ~/Dropbox/code/orglens-sandbox

python:
  version: "3.11"
  pyproject: true

claude:
  dangerously_skip_permissions: true
  plugins:
    - superpowers
