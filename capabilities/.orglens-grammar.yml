# How orglens sees this tree of capabilities — a second tree, and a second grammar file.
# Nothing in the engine assumes there is only one; which grammar governs which
# root is a config question, not an engine one.
version: 2

driver: README.md

entities:
  capability: "*"

artifacts:
  program:
    find: programs/*.md
    means: >
      A node program: what one node of a capability's workflow runs. One pass, one
      file written, performed by whoever is at the packet.
  skill:
    find: skills/*/SKILL.md
    means: >
      A skill a harness loads. Directory-shaped: a folder holding SKILL.md
      plus whatever it needs beside it.
  reference:
    find: references/*.md
    means: >
      Material a program or skill reads: a template, a voice, a list of
      patterns. Never performed on its own.

structure:
  capability:
    README.md: What the capability is for, and how its programs and skills fit together.
