# How orglens sees this bank — a second tree, and a second grammar file.
# Nothing in the engine assumes there is only one; which grammar governs which
# root is a config question, not an engine one.
version: 2

entities:
  deck: decks/*

artifacts:
  operator:
    find: operators/*/*.md
    means: >
      A method-deck card — one pass, one instruction, one model. Grouped by
      the phase it belongs to: inception, verification, communication.
  skill:
    find: skills/*/SKILL.md
    means: >
      A domain-deck card. Directory-shaped: the card is a folder holding
      SKILL.md plus whatever it needs beside it.
  agent:
    find: agents/*.md
    means: An agent definition the deck can dispatch.
  bias-pack:
    find: packs/bias/*.md
    means: A named bias to apply to a pass.
  voice-pack:
    find: packs/voice/*.md
    means: A named voice to write in.

structure:
  deck:
    DECK.md: What the deck is for, and how its cards fit together.
