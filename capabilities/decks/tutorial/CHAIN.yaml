# A three-stage chain, small enough to read in one sitting.
#
# A bug report arrives. Someone reproduces it, someone fixes it, someone checks
# the fix. If the check fails, a human sends it round again. When it passes,
# the chain is complete.
#
# Nothing here is about bugs as far as the engine is concerned. `reproduce`,
# `fix`, `verdict.md` are strings this file invents; the engine names the card
# and never reads what it writes. Swap them for `plan`/`apply`/`plan.tf` and
# the same engine runs a deploy.

deck: triage
stages:
  - name: reproduce
    card: cards/reproduce.md
    writes: repro.md

  # review: true stops the chain after this stage until someone runs `note`.
  - name: fix
    card: cards/fix.md
    writes: fix.md
    review: true

  - name: verify
    card: cards/verify.md
    writes: verdict.md
