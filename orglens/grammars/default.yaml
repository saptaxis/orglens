version: 2

# The format `orglens new` writes. Reading is every format, mixed, always:
# a tree may hold markdown and org side by side. `md` or `org`.
format: md

# The one document that says where an entity stands, whatever kind it is.
# Declared here rather than known by the engine, and the same name for every
# kind so nothing has to look it up. Long identity documents — a research
# question, an experiment's design — stay separate and are pointed at from it.
driver: overview

# What might be undeclared work. A unit exists because its marker says so,
# found at any depth; these patterns only name folders worth asking about when
# they carry no marker. Depth is never declared — an
# experiment is `expt-*` wherever it sits. A kind may also be declared under
# `structure:` alone, with no pattern: found by its markers only.
entities:
  client: clients/*
  project: projects/*
  research-program: research/*
  experiment: expt-*

# Where documents live, and what to call a new one. `find` is the truth; `means`
# is prose for whoever writes the next file. Nothing parses a filename, so no
# filename can be wrong. `find` may be a list when one kind lives in several
# containers — `plans/` kept as history beside a fresh `plans2/`. A `find`
# ending in `/` names directories rather than the files in them.
artifacts:
  plan:
    find: plans/*
    means: >
      A numbered unit of work, written before doing it. Name them
      NN-topic-MonDDYYYY — e.g. 05-data-collection-Feb062026 — with the
      format's extension. The log with the same number and topic is its record.
  log:
    find: logs/*
    means: >
      What actually happened executing the plan of the same number, written
      during or after. NN-topic-MonDDYYYY-log.
  doc:
    find: "*"
    means: >
      A document belonging to the entity as a whole rather than to a phase of
      work — a backlog, a handoff, a dated note, a requirements sheet. The
      catch-all: kinds are independent globs, so naming a narrower kind later
      costs nothing and moves nothing.
  spec:
    find: specs/*
    means: >
      A durable design document — what a thing is and why, not when. Named for
      its topic. Outlives the plans that implement it.
  article:
    find: articles/*/
    means: >
      A piece of public writing, one directory each, named for its slug. The
      directory is the packet the writing workflow runs over: brief, claims,
      skeleton, draft, critique, audit. A trailing slash in `find` means the
      artifact is the directory, not the files in it.

# What each part of an entity is for. Read when authoring, and by `new`, which
# seeds every file named here (a folder, with a trailing `/`, is never made).
# `check` reports a declared file that is missing, and does not report a
# folder of documents that some kind names here.
structure:
  client:
    overview: Who they are and the state of the engagement.
  project:
    overview: What it is, its stack, and where its state lives.
    specs/: Durable design documents for this project.
    plans/: Numbered units of work.
    logs/: What happened executing each plan.
  research-program:
    overview: Where the program stands, what is next, what is open.
    research-question: The question the program exists to answer. Often long; pointed at, not inlined.
    specs/: Design documents for the program's shared machinery.
    literature/: Papers and notes on prior work.
    directions/: Candidate directions not yet promoted to experiments.
    brainstorms/: Exploratory thinking, dated, not durable.
  experiment:
    overview: Where the experiment stands, what is next, what is open.
    design: What this experiment tests and how. Often long; pointed at, not inlined.
    plans/: Numbered units of work, scoped to this experiment.
    logs/: What happened executing each plan.
    findings/: What the experiment actually showed.
